[package]
name = "event_invites"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "event_invites"

[features]
# Default build (on-chain)
default = []

# Used when testing or building without the on-chain entrypoint
no-entrypoint = []

# Used when you don't want to emit an IDL (optional but common)
no-idl = []

# For generating IDL during `anchor idl build`
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
custom-heap = []
custom-panic = []
anchor-debug = []
no-log-ix-name = []

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.31.1", features = ["token", "associated_token"] }
